openapi: 3.1.0
info:
  title: Pharmax Partner API
  version: 1.0.0
  description: |
    Public v1 REST API for Pharmax partners (ADR-0032).

    ## Authentication
    Every request carries a partner API key as a bearer token:

        Authorization: Bearer pxk_<43 base64url chars>

    Keys are minted by an organization administrator in the Pharmax
    ops console, carry an explicit scope list, and can be revoked at
    any time. Unknown, malformed, and revoked keys all yield the same
    401 — the API never confirms whether a revoked key was once valid.

    ## Rate limiting and quotas
    Every API key belongs to a named quota tier with two independent
    ceilings enforced across the whole v1 surface:

    | Tier     | Burst rate  | Daily quota      |
    |----------|-------------|------------------|
    | STANDARD | 120 req/min | 50,000 req/day   |
    | ELEVATED | 600 req/min | 250,000 req/day  |

    Exceeding the burst rate yields `429` with `error.code:
    RATE_LIMITED` — a transient condition; wait `Retry-After` seconds
    and continue. Exceeding the daily quota yields `429` with
    `error.code: QUOTA_EXCEEDED` — the integration is over its tier;
    wait for the window to reset (`Retry-After`, seconds) or ask the
    pharmacy to move the key to a higher tier. Requests rejected by
    the burst gate do not consume daily quota. New keys default to
    STANDARD; ELEVATED is granted per partner agreement.

    ## Idempotency
    Every mutation (POST/DELETE) requires an `Idempotency-Key` header
    (8-200 characters, unique per logical request, namespaced to your
    key server-side). Replaying the same key with the same payload
    returns the original result with a 200 status and
    `meta.idempotentReplay: true`; replaying it with a different
    payload is rejected. One-time secret material (webhook signing
    secrets) is only present on the FIRST response — a replay returns
    the created resource with the secret field `null`.

    ## Errors
    Every error carries a stable `error.code` and a human-readable
    `error.message`. The STATUS tells you what to do about it; the
    code tells you which rule fired. Branch on the status first:

    | Status | Meaning                                    | Retry?          |
    |--------|--------------------------------------------|-----------------|
    | 400    | The request is malformed or a field is invalid. | No — fix it. |
    | 401    | The API key is missing, unknown, or revoked.    | No.          |
    | 403    | The key lacks the scope for this operation.     | No.          |
    | 404    | No such resource in your organization.          | No.          |
    | 409    | A state race or allocation collision.           | **Yes** — resubmit. |
    | 422    | Well-formed and authorized, refused by a domain or regulatory rule. | No. |
    | 429    | Rate limit or daily quota.                      | Yes, after `Retry-After`. |
    | 500    | A fault on our side, not a defect in your request. | **Yes**.  |

    409 and 500 are the two you should retry automatically. Reuse the
    SAME `Idempotency-Key` when you do: the retry either performs the
    operation or returns the original result, so a 500 raised after
    the write committed cannot produce a duplicate.

    A 500 response body carries the typed code — quote it when you
    contact support — but a generic message: internal failures are
    not described to callers in detail.

    ## PHI
    v1 order resources are PHI-free by construction: workflow, state,
    and timing fields plus opaque UUID references only. Patient
    demographics are not exposed on this surface.

    The prescription intake body is the one exception, and it is
    write-only: `sig`, the two notes and the indication are clinical
    free text, encrypted on arrival and never returned by any v1 read.
    Do not place them in a query string or a log on your side either.

    ## Webhooks
    Subscriptions deliver registered PHI-safe platform events to your
    HTTPS endpoint. Each delivery is signed with your subscription
    secret (shown exactly once at creation):

        Pharmax-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256>

    The signed message is `<t>.<raw request body>`. Reject deliveries
    older than 5 minutes and verify with a constant-time comparison.
    Deliveries are at-least-once; use the event `id` for dedup.

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: app.pharmax.example

security:
  - apiKey: []

tags:
  - name: Orders
    description: Read-only order state and workflow progress.
  - name: Prescriptions
    description: Transcribe prescriptions for later attachment to an order.
  - name: Webhook Subscriptions
    description: Manage outbound event delivery endpoints.
  - name: Webhook Deliveries
    description: Delivery ledger, including the dead-letter view.

paths:
  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: List orders
      description: |
        Newest-first, cursor-paginated. Requires the `orders.read`
        scope.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque cursor from `pagination.nextCursor`.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Filter by workflow status.
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OrderSummary" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Submit an order (intake)
      description: |
        Order intake. The order enters the workflow at `RECEIVED` and
        is subject to every platform invariant (clinic/site linkage,
        patient and prescription ownership, workflow policy, SLA
        timers). Requires the `orders.create` scope and an
        `Idempotency-Key` header.

        `intakeSourceKind` is set by the platform (always `API` on
        this endpoint) and must not be supplied.

        All references (`clinicId`, `siteId`, `patientId`,
        `lines[].prescriptionId`) must identify existing records in
        your organization; patient demographics and prescription
        content are provisioned out-of-band and never cross this
        surface.

        Retrying with the same `Idempotency-Key` returns the original
        order as a 200 with `meta.idempotentReplay: true` — no
        duplicate order is created.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clinicId, siteId, patientId, lines]
              properties:
                clinicId:
                  type: string
                  format: uuid
                siteId:
                  type: string
                  format: uuid
                patientId:
                  type: string
                  format: uuid
                externalOrderNumber:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: |
                    Optional clinic-assigned order number. Must not
                    carry PHI.
                intakeSourceRefId:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: |
                    Optional upstream identifier (e.g. an encounter
                    or batch-row id). Must not carry PHI.
                priority:
                  type: string
                  enum: [NORMAL, RUSH, EMERGENCY]
                  default: NORMAL
                lines:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [prescriptionId, quantityToFill, daysSupplyToFill]
                    properties:
                      prescriptionId:
                        type: string
                        format: uuid
                      quantityToFill:
                        type: number
                        exclusiveMinimum: 0
                      daysSupplyToFill:
                        type: integer
                        minimum: 1
      responses:
        "201":
          description: Order created at `RECEIVED`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrderCreated" }
        "200":
          description: Idempotent replay of a previous submission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrderCreated" }
                  meta:
                    type: object
                    properties:
                      idempotentReplay: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Get one order
      description: |
        Detail view with order lines (opaque prescription references
        + fill quantities) and shipment tracking summaries. Requires
        the `orders.read` scope.
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/OrderDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /prescriptions:
    post:
      operationId: createPrescription
      tags: [Prescriptions]
      summary: Transcribe a prescription
      description: |
        Create a prescription so it can later be attached to an order.
        Requires the `prescriptions.create` scope and an
        `Idempotency-Key`.

        Two things are NOT yours to set. The **Rx number** is issued
        by the pharmacy's allocator and returned in the response. The
        **DEA schedule** is read from the pharmacy's product catalog
        by NDC; send `controlledSubstanceSchedule` only when the NDC
        is not catalogued (otherwise omit it, or send a value that
        agrees — a disagreement is rejected rather than accepted as
        an override).

        Controlled-substance authorization is checked at issuance,
        not at dispense: a Schedule II prescription may authorize no
        refills (21 CFR 1306.12(a)), Schedule III and IV at most five
        (21 CFR 1306.22(a)), and the prescriber must hold a DEA
        registration for any controlled schedule.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  clinicId,
                  patientId,
                  providerId,
                  drugNdc,
                  drugName,
                  quantityAuthorized,
                  daysSupply,
                  refillsAuthorized,
                  originalDateWritten,
                  sig,
                ]
              properties:
                clinicId:
                  type: string
                  format: uuid
                patientId:
                  type: string
                  format: uuid
                  description: Must belong to `clinicId` and be ACTIVE.
                providerId:
                  type: string
                  format: uuid
                drugNdc:
                  type: string
                  maxLength: 32
                  description: |
                    10- or 11-digit NDC; hyphens allowed. Normalized
                    to 11 digits before the catalog lookup.
                drugName:
                  type: string
                  minLength: 1
                  maxLength: 200
                drugStrength:
                  type: string
                  minLength: 1
                  maxLength: 100
                drugForm:
                  type: string
                  minLength: 1
                  maxLength: 100
                controlledSubstanceSchedule:
                  type: string
                  enum: [NON_CONTROLLED, CII, CIII, CIV, CV]
                  description: |
                    Required only when the NDC is absent from the
                    catalog — an uncatalogued drug is never assumed
                    non-controlled.
                quantityAuthorized:
                  type: string
                  pattern: '^\d{1,14}(\.\d{1,4})?$'
                  description: |
                    Decimal STRING, up to four fractional digits. A
                    string because the column is DECIMAL(18,4) and
                    IEEE-754 cannot represent every value exactly.
                daysSupply:
                  type: integer
                  minimum: 1
                  maximum: 365
                refillsAuthorized:
                  type: integer
                  minimum: 0
                  maximum: 99
                  description: |
                    Capped further by the DEA schedule; see the
                    controlled-substance rules above.
                originalDateWritten:
                  type: string
                  format: date
                  description: YYYY-MM-DD. May not be in the future.
                expiresAt:
                  type: string
                  format: date
                  description: |
                    Omit to derive: six months for a controlled
                    substance, one year otherwise. A Schedule III or
                    IV expiry beyond six months from the date written
                    is rejected (21 CFR 1306.22(a)).
                earliestFillDate:
                  type: string
                  format: date
                  description: Do-not-fill-before; may not precede the date written.
                daw:
                  type: integer
                  minimum: 0
                  maximum: 9
                  default: 0
                  description: NCPDP "dispense as written" code.
                sig:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: |
                    Directions for use. PHI — encrypted on arrival,
                    redacted from our command log, and never returned
                    by any v1 read.
                sigStructureKind:
                  type: string
                  enum: [FIXED, PRN, RANGE, TAPER]
                  description: |
                    Optional structured-sig summary of `sig`, used by
                    the pharmacist dose-range screen. All four
                    structured-sig fields are optional; the free-text
                    `sig` remains the authoritative instruction.
                doseAmount:
                  type: string
                  pattern: '^\d{1,8}(\.\d{1,4})?$'
                  description: |
                    Dose per administration. Decimal STRING (up to
                    four fractional digits), same IEEE-754 rationale
                    as `quantityAuthorized`. Must be greater than 0.
                doseUnit:
                  type: string
                  enum:
                    [
                      MG,
                      MCG,
                      G,
                      MEQ,
                      ML,
                      UNIT,
                      TABLET,
                      CAPSULE,
                      DROP,
                      PUFF,
                      SPRAY,
                      PATCH,
                      APPLICATION,
                    ]
                  description: Coded unit `doseAmount` is denominated in.
                dosesPerDay:
                  type: string
                  pattern: '^\d{1,2}(\.\d{1,4})?$'
                  description: |
                    Administrations per day. Decimal STRING — e.g.
                    every-other-day is "0.5". Must be greater than 0
                    and at most 24.
                noteToPharmacist:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: PHI; same handling as `sig`.
                noteToPatient:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: PHI; same handling as `sig`.
                indication:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: PHI; same handling as `sig`.
      responses:
        "201":
          description: Prescription created at `ACTIVE`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PrescriptionCreated" }
        "200":
          description: Idempotent replay of a previous submission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/PrescriptionCreated" }
                  meta:
                    type: object
                    properties:
                      idempotentReplay: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Nothing was written. `RX_NUMBER_COLLISION` means the
            allocated Rx number was taken — resubmit and the next
            attempt takes a fresh one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      tags: [Webhook Subscriptions]
      summary: List webhook subscriptions
      description: |
        Also returns the current catalogue of subscribable event
        types. Signing secrets are never included. Requires the
        `webhooks.manage` scope.
      responses:
        "200":
          description: Subscriptions + eligible event types.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
                  eligibleEventTypes:
                    type: array
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: createWebhookSubscription
      tags: [Webhook Subscriptions]
      summary: Create a webhook subscription
      description: |
        Registers an HTTPS endpoint for one or more PHI-safe event
        types. The 201 response contains the signing `secret` exactly
        once — store it immediately; it cannot be retrieved again.
        Requires the `webhooks.manage` scope and an `Idempotency-Key`
        header.

        Retrying with the same `Idempotency-Key` returns the original
        subscription as a 200 with `secret: null` and
        `meta.idempotentReplay: true` — no duplicate subscription is
        created. If the first response (and the secret with it) was
        lost, revoke the subscription and create a new one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, eventTypes]
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS endpoint. Non-HTTPS URLs are rejected.
                eventTypes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                  description: Registered PHI-safe event names (see `eligibleEventTypes`).
                description:
                  type: string
                  maxLength: 500
      responses:
        "201":
          description: Subscription created. `secret` is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WebhookSubscriptionCreated" }
        "200":
          description: |
            Idempotent replay. The ORIGINAL subscription is returned;
            `secret` is `null` (it was only available on the first
            response).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/WebhookSubscriptionCreated" }
                  meta:
                    type: object
                    properties:
                      idempotentReplay: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhook-subscriptions/{subscriptionId}:
    delete:
      operationId: revokeWebhookSubscription
      tags: [Webhook Subscriptions]
      summary: Revoke a webhook subscription
      description: |
        Disables the endpoint immediately. Deliveries still in flight
        are dead-lettered rather than drained (compromise-first: a
        revoked endpoint receives nothing further). Requires the
        `webhooks.manage` scope and an `Idempotency-Key` header. An
        optional JSON body may carry a `reason`.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: |
            Subscription disabled. Unlike the other mutations, a
            replay of the same `Idempotency-Key` returns this same
            200 body WITHOUT a `meta.idempotentReplay` marker.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subscriptionId: { type: string, format: uuid }
                      url: { type: string, format: uri }
                      disabledAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhook-subscriptions/{subscriptionId}/rotate-secret:
    post:
      operationId: rotateWebhookSubscriptionSecret
      tags: [Webhook Subscriptions]
      summary: Rotate a subscription's signing secret
      description: |
        Replaces the HMAC signing secret in place. The 200 response
        contains the NEW `secret` exactly once — store it
        immediately; it cannot be retrieved again.

        Cut-over is immediate and single-secret: every delivery
        attempt after this call — including retries of previously
        failed deliveries — is signed with the new secret. Install
        the new secret on your receiver as soon as you receive it.

        Only `ACTIVE` subscriptions can be rotated; a disabled
        subscription must be replaced with a new one. Requires the
        `webhooks.manage` scope and an `Idempotency-Key` header.

        Retrying with the same `Idempotency-Key` returns a 200 with
        `secret: null` and `meta.idempotentReplay: true` — the secret
        stored by the ORIGINAL attempt remains active and is not
        re-disclosed. If the first response was lost, rotate again
        with a new `Idempotency-Key`.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: |
            Secret rotated (`secret` shown once) — or an idempotent
            replay (`secret: null`). Both outcomes are a 200; the
            replay is distinguished by `meta.idempotentReplay` (the
            first rotation carries NO `meta` object).
          content:
            application/json:
              schema:
                oneOf:
                  - title: First rotation
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          subscriptionId: { type: string, format: uuid }
                          url: { type: string, format: uri }
                          rotatedAt: { type: string, format: date-time }
                          secret:
                            type: string
                            description: |
                              The new `pxw_` signing secret. Present
                              only on this first response for a given
                              `Idempotency-Key`.
                  - title: Idempotent replay
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          subscriptionId: { type: string, format: uuid }
                          url: { type: string, format: uri }
                          rotatedAt: { type: string, format: date-time }
                          secret:
                            type: "null"
                            description: |
                              Never re-disclosed on a replay — the
                              secret stored by the original attempt
                              remains active.
                      meta:
                        type: object
                        properties:
                          idempotentReplay: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Webhook Deliveries]
      summary: List webhook deliveries
      description: |
        Delivery ledger for self-diagnosis. Filter `status=DEAD` for
        the dead-letter view. Payload snapshots are not included.
        Requires the `webhooks.manage` scope.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        - name: subscriptionId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of deliveries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/ScopeDenied" }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "pxk_<token>"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request; 8-200 characters.
      schema: { type: string, minLength: 8, maxLength: 200 }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, malformed, unknown, or revoked API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ScopeDenied:
      description: The API key does not carry the required scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found in this organization.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: >-
        A state race or an allocation collision — the request was
        well-formed and nothing was written. Resubmit with the same
        `Idempotency-Key`. The most common code here is
        `COMMAND_IN_FLIGHT`: a concurrent request with that key is
        still executing, and retrying it replays the winner's
        response once it commits.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Valid shape, rejected by domain rules (typed code).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: >-
        A fault on the Pharmax side. `error.code` is the typed code to
        quote to support; `error.message` is deliberately generic.
        Safe to retry with the same `Idempotency-Key`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: >-
        Per-key limit exceeded. `error.code` distinguishes the burst
        rate (`RATE_LIMITED` — transient, back off `Retry-After`
        seconds) from the daily tier quota (`QUOTA_EXCEEDED` — wait
        for the window to reset or upgrade the key's tier).
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the window resets.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Pagination:
      type: object
      properties:
        hasMore: { type: boolean }
        nextCursor:
          type: [string, "null"]
          format: uuid

    OrderStatus:
      type: string
      description: Primary workflow states plus exception states.
      enum:
        - RECEIVED
        - TYPING_IN_PROGRESS
        - TYPED_READY_FOR_PV1
        - PV1_IN_PROGRESS
        - PV1_APPROVED_READY_FOR_FILL
        - FILL_IN_PROGRESS
        - FILL_COMPLETED_READY_FOR_FINAL
        - FINAL_VERIFICATION_IN_PROGRESS
        - FINAL_VERIFICATION_APPROVED_READY_FOR_SHIP
        - READY_TO_SHIP
        - SHIPPED
        - TYPING_PENDING_MISSING_INFO
        - PV1_REJECTED
        - FINAL_VERIFICATION_REJECTED
        - ON_HOLD
        - CANCELLED

    WebhookDeliveryStatus:
      type: string
      enum: [PENDING, SENT, FAILED, DEAD]

    PrescriptionCreated:
      type: object
      properties:
        prescriptionId: { type: string, format: uuid }
        rxNumber:
          type: string
          description: Issued by the pharmacy's allocator, never by the caller.
        controlledSubstanceSchedule:
          type: string
          enum: [NON_CONTROLLED, CII, CIII, CIV, CV]
          description: >-
            The schedule actually recorded — from the product catalog
            when the NDC is catalogued, otherwise the declared value.
        expiresAt: { type: string, format: date }

    OrderCreated:
      type: object
      description: Result of a successful intake submission.
      properties:
        orderId: { type: string, format: uuid }
        orderLineIds:
          type: array
          items: { type: string, format: uuid }
        currentStatus: { type: string, enum: [RECEIVED] }
        version: { type: integer, enum: [0] }

    OrderSummary:
      type: object
      description: PHI-free order projection. All references are opaque UUIDs.
      properties:
        id: { type: string, format: uuid }
        externalOrderNumber: { type: [string, "null"] }
        clinicId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        currentStatus: { $ref: "#/components/schemas/OrderStatus" }
        priority: { type: string }
        version: { type: integer }
        slaDeadlineAt: { type: [string, "null"], format: date-time }
        receivedAt: { type: string, format: date-time }
        shippedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            orderLines:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  prescriptionId: { type: string, format: uuid }
                  quantityToFill: { type: string, description: Decimal as string. }
                  daysSupplyToFill: { type: integer }
                  lineStatus: { type: string }
            shipments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  carrier: { type: string }
                  serviceLevel: { type: string }
                  trackingNumber: { type: string }
                  status: { type: string }
                  createdAt: { type: string, format: date-time }

    WebhookSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        disabledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    WebhookSubscriptionCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        status: { type: string, enum: [ACTIVE] }
        secret:
          type: [string, "null"]
          description: |
            `pxw_`-prefixed HMAC signing secret. Shown exactly once,
            on FIRST creation only; never retrievable again. `null`
            on an idempotent replay.

    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        subscriptionId: { type: string, format: uuid }
        eventType: { type: string }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        attempts: { type: integer }
        lastError: { type: [string, "null"] }
        responseStatus: { type: [integer, "null"] }
        nextAttemptAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
