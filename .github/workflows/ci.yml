# Pharmax CI — runs on every PR + every push to main.
#
# This workflow is the SOURCE OF TRUTH for "the build is green". A PR
# may not merge unless every job below succeeds. Locally, `pnpm verify`
# runs the same gates except the `integration` and `drift` jobs, which
# need a Postgres service container (run those locally with `pnpm db:up`
# + `pnpm test:integration` / `pnpm check:drift`).
#
# Job design:
#   - One `setup` job that installs deps + generates Prisma client and
#     caches everything. Subsequent jobs `needs:` it and reuse the
#     cached pnpm store + node_modules.
#   - Parallel quality jobs (lint, format, typecheck, prisma-validate,
#     custom safety linters) so a broken format isn't gated behind a
#     30s typecheck.
#   - A single `test` job that runs Vitest with coverage thresholds.
#     Coverage thresholds enforced by `vitest.config.ts` — a drop
#     fails the job.
#
# Permissions: principle of least privilege. The default
# `contents: read` token is enough for everything here; no `write` or
# `id-token` scopes are granted.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Allow manual reruns from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per (workflow, branch). New pushes cancel in-flight runs
  # on the same branch — saves CI minutes and surfaces the latest
  # state faster.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned for reproducibility. Matches `engines.node` in package.json
  # and the corepack-managed pnpm version. Bumping these is a separate
  # PR so we get a clean reviewable change.
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.1"
  # Prevent pnpm from prompting in non-TTY environments.
  CI: "true"

jobs:
  setup:
    name: Install + generate Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pnpm-store-path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Locate pnpm store
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `postinstall` already runs `pnpm db:generate`, but we cache
      # the generated client across jobs so downstream jobs don't
      # have to regenerate.
      - name: Cache generated Prisma client
        uses: actions/cache/save@v4
        with:
          path: packages/database/src/generated
          key: prisma-client-${{ runner.os }}-${{ hashFiles('prisma/schema.prisma') }}

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: Typecheck
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  prisma-validate:
    name: Prisma validate
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:validate

  safety-linters:
    name: Pharmacy safety linters
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # These are the Pharmax-specific gates:
    #   - check:migrations enforces RLS on every new table.
    #   - check:schema enforces tenancy + audit invariants.
    #   - check:commands enforces the command-handler layout.
    #   - check:kms-inventory diffs docs/security/kms-key-inventory.md
    #     against infra/terraform/modules/kms/main.tf so the auditor-
    #     facing inventory cannot silently drift from the IaC truth
    #     (closes the `kms3` follow-up).
    #   - check:alarm-actions asserts that a production CloudWatch
    #     alarm cannot be declared with an empty action list: every
    #     alarm routes to a severity topic, documents which tier and
    #     why, and every prod env-region enables alerting. Prevents a
    #     repeat of the 16 alarms that evaluated correctly and
    #     notified nobody.
    #   - check:raw-prisma bans importing the raw, unscoped
    #     `systemPrisma` client outside the reviewed allowlist, so the
    #     tenancy-enforced `prisma` stays the only client app code uses.
    #   - check:raw-sql bans calling Prisma's raw-SQL escape hatches
    #     ($queryRaw/$executeRaw/*Unsafe) in non-test app/package code
    #     outside the reviewed allowlist — raw SQL is where RLS
    #     bypasses hide.
    #   - check:caught-cause closes eslint preserve-caught-error's
    #     blind spot: constructing a PharmaxError-style init-object
    #     error inside a catch block must chain the caught error via
    #     `cause` (or carry a `// cause-omitted: <reason>` annotation),
    #     so the original failure survives to the log.
    #   - check:terraform-apply-workflow asserts the structural
    #     invariants on .github/workflows/terraform-apply.yml — the
    #     approval-gated production-apply workflow. Catches regressions
    #     like an accidentally-added `push:` trigger or a `terraform
    #     apply -auto-approve` slip-through. Closes the `tf1-applyflow`
    #     follow-up.
    #   - check:layers enforces the internal `@pharmax/*` package
    #     dependency graph: it must stay acyclic and domain packages may
    #     not import sibling domains except over the allowlisted edges.
    #     Pure static analysis (reads package.json graph), so it belongs
    #     in this no-database job rather than only behind `pnpm verify`.
    #   - check:partner-contract diffs the live /api/v1 route tree
    #     against docs/api/openapi-v1.yaml (the partner wire contract,
    #     ADR-0032/0040) in both directions: a v1 route without a spec
    #     entry, or a spec operation without a route, fails the build.
    #     Response-BODY shapes are locked by the contract tests in the
    #     `test` job (apps/web/app/api/v1/contract.test.ts).
    # Each is a TypeScript file under `scripts/`. They run sequentially
    # in this job because each is fast (sub-second).
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:migrations
      - run: pnpm check:schema
      - run: pnpm check:commands
      - run: pnpm check:kms-inventory
      - run: pnpm check:alarm-actions
      - run: pnpm check:raw-prisma
      - run: pnpm check:raw-sql
      - run: pnpm check:caught-cause
      - run: pnpm check:terraform-apply-workflow
      - run: pnpm check:layers
      - run: pnpm check:partner-contract
      - run: pnpm events:validate
      - run: pnpm events:migrate-check

  test:
    name: Unit tests + coverage
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `test:coverage` runs the full suite AND enforces the
      # thresholds configured in `vitest.config.ts`. A drop below
      # any threshold (global or per-package) fails the job.
      - run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # Real-Postgres integration suite. This job used to live in
  # integration.yml, path-filtered to database-adjacent changes, on the
  # argument that a Postgres service container "roughly doubles job
  # startup time" and running it on every PR "is wasteful when the
  # change touches no SQL". That rationale stopped holding when the
  # suite became the ONLY verification of the command bus's core
  # invariant — the atomic command_log/order_event/audit_log/
  # event_outbox write, RLS enforced as `pharmax_app`, rollback on
  # conflict. Any package can add a command that breaks those, so path
  # filtering was a hole, and a merge-blocking check cannot live outside
  # this workflow anyway: `ci-pass` aggregates via `needs`, which cannot
  # cross workflows. The ~1–2 min per PR is the price of the invariant
  # actually blocking a merge.
  #
  # Still sequential within the job (single-fork pool — see
  # packages/integration-tests/vitest.config.ts): one Postgres instance,
  # one test process, per-tenant advisory locks.
  integration:
    name: Integration tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmax
        ports:
          - 5432:5432
        # Wait for Postgres to be ready before the steps run. Without
        # this, the first `prisma migrate deploy` races the container
        # startup and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmax
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pharmax
      # The integration suite never wires apps' KMS env vars, but the
      # tenancy + crypto packages need a seed for their own boots.
      PHARMAX_LOCAL_KMS_SEED: ci-integration-seed-do-not-use-in-prod-32+chars

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Run integration tests
        run: pnpm test:integration

      # Seed smoke + completeness. Runs AFTER the integration suite so the
      # demo dataset can never influence its fixtures.
      #
      # prisma/seed.ts had no automated exercise of any kind until now,
      # which is how the ADR-0033 provider portal reached main without its
      # seed wiring and stayed that way — the only file in the repo where a
      # regression was invisible to CI.
      - name: Seed the demo dataset
        run: pnpm db:seed

      # Twice, because the seed is upsert-based and the whole workflow
      # (`db:seed` after a schema change, re-running it locally) depends on
      # re-runnability. A non-idempotent write shows up here as a unique
      # constraint violation rather than in someone's local database.
      - name: Seed again — idempotency
        run: pnpm db:seed

      # A seed that OMITS a fixture still exits 0, so the two steps above
      # prove only that it isn't broken. This asserts it isn't incomplete.
      - name: Assert the demo dataset is complete
        run: pnpm check:seed

  # Migration <-> schema drift guard. Runs in its OWN Postgres service
  # (not the integration job's) because `check:drift` replays every
  # migration into a shadow database, and the RLS baseline creates
  # CLUSTER-GLOBAL roles (pharmax_app / pharmax_system). Replaying into a
  # shadow that shares a cluster with an already-migrated `pharmax` DB
  # would collide on the role creation; a dedicated fresh cluster creates
  # those roles exactly once. The pharmax DB here is only used to DERIVE
  # the shadow URL (DATABASE_URL + "_drift_shadow"); it is never migrated.
  #
  # Moved here from the retired integration.yml alongside the
  # integration job, for the same reason: a check that can block a merge
  # has to be aggregated by `ci-pass`, and `needs` cannot cross
  # workflows.
  drift:
    name: Prisma migration↔schema drift
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pharmax
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/pharmax

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The shadow DB must exist + be empty; check:drift resets it and
      # replays the migration history into it. (Prisma resets objects but
      # does not CREATE the database itself.)
      - name: Create drift shadow database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE pharmax_drift_shadow;'

      - name: Check migration↔schema drift
        run: pnpm check:drift

  audit:
    name: Dependency audit (advisory)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Advisory only: warnings here don't block the merge but they DO
    # show up in the PR checks list so reviewers can see "Sentry CLI
    # CVE filed yesterday" without leaving the page. Promotion of a
    # CVE class to "blocking" happens via a follow-up PR that flips
    # `continue-on-error` to false on a per-severity basis.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: "${{ env.PNPM_VERSION }}", run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high --prod

  # Aggregate status: a single job that all branch protection rules
  # can point to. When we add or remove jobs above, we only update
  # `needs:` here — protection rules don't change.
  ci-pass:
    name: ci-pass
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, prisma-validate, safety-linters, test, integration, drift]
    if: always()
    steps:
      - name: All required jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more required CI jobs failed or were cancelled."
          exit 1
      - run: echo "All required CI jobs passed."
