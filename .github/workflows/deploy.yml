# Pharmax deploy — build container images, push to ECR, roll out to ECS.
#
# Pipeline: source → ECR → migrate → ECS Fargate. Builds the `web` and
# `worker` images from apps/<svc>/Dockerfile, pushes immutable release
# tags to the per-service ECR repos provisioned by
# infra/terraform/modules/ecr, applies any pending Prisma migrations as a
# one-off Fargate task (see the `migrate` job — the rollout is gated on
# it so code never runs ahead of the schema), then registers a new
# task-definition revision per service and updates the ECS service (with
# deployment circuit-breaker rollback already configured on the service
# in Terraform).
#
# ---------------------------------------------------------------------------
# Why this is gated behind a GitHub Environment + repo/Environment vars
# ---------------------------------------------------------------------------
#   AWS access is via GitHub Actions OIDC — no long-lived keys. The deploy
#   role is assumed per the pattern in `terraform-drift.yml` and documented
#   in `docs/operations/production-deployment.md`. Configure these as
#   Environment-scoped variables so prod can require reviewers:
#
#     vars.AWS_DEPLOY_ROLE_ARN   IAM role assumed via OIDC (REQUIRED)
#     vars.ECS_NAME_PREFIX       Terraform name_prefix, e.g. "pharmax-prod" (REQUIRED)
#     vars.AWS_DEPLOY_REGION     Target region (optional; defaults us-east-1)
#     vars.DEPLOY_ENVIRONMENT    GitHub Environment name (optional; defaults "staging")
#
#   If AWS_DEPLOY_ROLE_ARN or ECS_NAME_PREFIX is unset (e.g. a fork, or an
#   account not yet bootstrapped) the workflow gracefully no-ops instead of
#   failing — same philosophy as the drift workflow.
#
#   The deploy role's policy needs (least privilege):
#     - ecr:GetAuthorizationToken
#     - ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
#       ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
#       ecr:BatchGetImage (scoped to the pharmax/* repos)
#     - ecs:DescribeServices, ecs:DescribeTaskDefinition,
#       ecs:RegisterTaskDefinition, ecs:UpdateService
#     - ecs:RunTask, ecs:DescribeTasks (the pre-rollout migration task,
#       scoped to this cluster + the worker task-definition family)
#     - logs:GetLogEvents on /ecs/<name_prefix>/worker (read back which
#       migrations the task applied)
#     - iam:PassRole for the task execution + task roles (scoped to the
#       ARNs from infra/terraform/modules/iam)
#
# Naming contract (must match Terraform):
#   ECR repo   = <name_prefix>/<svc>
#   TD family  = <name_prefix>-<svc>
#   container  = <svc>            (matches container_definitions[].name)
#   service    = <name_prefix>-<svc>
#   cluster    = <name_prefix>-cluster
#
name: deploy

# MANUAL ONLY. This workflow does NOT run on push/merge — a merge to main can
# never reach live infrastructure on its own. Deploys are triggered explicitly
# from the Actions tab (workflow_dispatch), which also lets the GitHub
# Environment's required-reviewer protection gate a production rollout. It
# still no-ops unless the deploy vars below are configured.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override image tag (default: release-<date>-<sha>)"
        required: false
        type: string

# A failed/rolled-back deploy should not be re-triggered by a stale run.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required for GitHub Actions OIDC → assume-role.
  id-token: write

jobs:
  preflight:
    name: Preflight — is the deploy target configured?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
      name_prefix: ${{ vars.ECS_NAME_PREFIX }}
      region: ${{ steps.check.outputs.region }}
      deploy_services: ${{ steps.services.outputs.deploy_services }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "${{ vars.ECS_NAME_PREFIX }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Deploy target configured; build + deploy jobs will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN and/or ECS_NAME_PREFIX not set."
            echo "::notice::Skipping deploy. See docs/operations/production-deployment.md."
          fi
          region="${{ vars.AWS_DEPLOY_REGION }}"
          echo "region=${region:-us-east-1}" >> "$GITHUB_OUTPUT"

      - id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="release-$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $tag"

      # Which services actually get rolled out. Images are still BUILT for
      # all three (see the build job) so nothing silently rots and turning a
      # service back on needs no image backfill — this gates the rollout only.
      #
      # print-agent is opt-in because it cannot run unattended in the cloud:
      # it resolves a specific pharmacy workstation from the database at boot
      # and, in tcp mode, needs a network path to a physical Zebra printer.
      # Neither exists for a task in a private Fargate subnet, so deploying it
      # produced a service that could never stabilize and a deploy that always
      # reported failure (2026-08-02). Set DEPLOY_PRINT_AGENT=true once a real
      # site, workstation, and reachable printer exist.
      - id: services
        run: |
          services='["web","worker"]'
          if [ "${{ vars.DEPLOY_PRINT_AGENT }}" = "true" ]; then
            services='["web","worker","print-agent"]'
          else
            echo "::notice::print-agent rollout is disabled (DEPLOY_PRINT_AGENT is not 'true')."
            echo "::notice::Its image is still built and pushed; only the ECS rollout is skipped."
          fi
          echo "deploy_services=$services" >> "$GITHUB_OUTPUT"
          echo "Services to roll out: $services"

  build:
    name: Build + push (${{ matrix.service }})
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: worker
            dockerfile: apps/worker/Dockerfile
          - service: print-agent
            dockerfile: apps/print-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.preflight.outputs.region }}
          role-session-name: gh-actions-deploy-${{ matrix.service }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable release tag (ECR repos are tag-immutable). No
          # :latest — every deploy is traceable to a commit.
          tags: ${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.name_prefix }}/${{ matrix.service }}:${{ needs.preflight.outputs.image_tag }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Schema migrations — MUST land before any service rolls over.
  #
  # Without this job the pipeline shipped code that was ahead of the
  # database: nothing here (and nothing in either Dockerfile's CMD)
  # applied migrations, so `prisma migrate deploy` was a manual,
  # out-of-band step an operator had to remember. Miss it and the new
  # containers query tables that do not exist yet — while the ECS
  # container health check and even the SSR smoke check below can still
  # report green, because a boot-time liveness route need not touch the
  # new tables. That is the same class of silent failure the smoke check
  # was added to catch.
  #
  # Why a one-off task on the WORKER definition rather than a step on
  # this runner: RDS is private to the VPC, so a GitHub-hosted runner
  # cannot reach it. The worker image is the only one that can run the
  # CLI — it copies the whole workspace (so `prisma/migrations` is
  # present), installs devDependencies (so the `prisma` CLI resolves —
  # its own build step already runs `prisma generate`), and carries the
  # RDS CA bundle. The web image is standalone Next.js output with none
  # of that.
  #
  # Credentials: the task definition already injects DIRECT_URL — the
  # owner/superuser connection reserved for DDL — and `prisma.config.ts`
  # points the CLI's datasource at DIRECT_URL (falling back to
  # DATABASE_URL only for local dev). The runtime DATABASE_URL selects
  # `pharmax_system`, which is BYPASSRLS but does NOT own the schema, so
  # migrations would fail against it. Nothing is overridden here; the
  # command override alone selects the right role.
  #
  # `prisma migrate deploy` is idempotent — already-applied migrations
  # are skipped — so re-running a failed deploy is safe. The trailing
  # `migrate status` turns "did every migration land?" into a
  # pipeline-enforced assertion instead of an operator's manual check.
  migrate:
    name: Apply database migrations
    needs: [preflight, build]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}
    env:
      CLUSTER: ${{ needs.preflight.outputs.name_prefix }}-cluster
      FAMILY: ${{ needs.preflight.outputs.name_prefix }}-worker
      SERVICE: ${{ needs.preflight.outputs.name_prefix }}-worker
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.preflight.outputs.region }}
          role-session-name: gh-actions-migrate

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' \
            --output json > td.raw.json
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            td.raw.json > td.json

      # RunTask cannot override the image, so the migration has to run
      # from a revision that already carries the new one — otherwise the
      # old image would apply the OLD migration set and the schema would
      # still trail the code.
      - name: Render the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: td.json
          container-name: worker
          image: ${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.name_prefix }}/worker:${{ needs.preflight.outputs.image_tag }}

      - name: Register the migration task definition
        id: register
        run: |
          arn=$(aws ecs register-task-definition \
                  --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
                  --query 'taskDefinition.taskDefinitionArn' \
                  --output text)
          echo "Registered: $arn"
          echo "td_arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Apply migrations (one-off Fargate task)
        run: |
          set -uo pipefail

          # Reuse the worker service's own subnets + security groups so
          # the task lands where RDS already accepts connections from.
          net=$(aws ecs describe-services \
                  --cluster "$CLUSTER" --services "$SERVICE" \
                  --query 'services[0].networkConfiguration' --output json)
          if [ -z "$net" ] || [ "$net" = "null" ]; then
            echo "::error::Could not read networkConfiguration from $SERVICE."
            exit 1
          fi

          overrides=$(jq -nc '{
            containerOverrides: [{
              name: "worker",
              command: ["sh","-lc","cd /app && pnpm db:migrate:deploy && pnpm exec prisma migrate status"]
            }]
          }')

          err=$(mktemp)
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "${{ steps.register.outputs.td_arn }}" \
            --launch-type FARGATE \
            --network-configuration "$net" \
            --overrides "$overrides" \
            --started-by "gh-migrate-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' --output text 2>"$err")

          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            cat "$err"
            # Unlike the secret preflight below, this does NOT degrade to a
            # warning when the IAM grant is missing: skipping migrations is
            # the exact failure this job exists to prevent, so it fails
            # closed and the rollout never starts.
            if grep -qi 'AccessDenied' "$err"; then
              echo "::error::Deploy role cannot RunTask — apply infra/terraform/modules/cicd-deploy"
              echo "::error::(statement EcsRunMigrationTask) before dispatching this workflow."
            fi
            echo "::error::RunTask returned no task ARN; migrations did not run."
            exit 1
          fi
          echo "Migration task: $task_arn"

          # `wait tasks-stopped` polls for up to ~10 minutes. If it gives
          # up we still fall through to the exit-code check, which fails
          # closed rather than letting the rollout proceed.
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn" || true

          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
                        --query 'tasks[0].containers[0].exitCode' --output text)
          reason=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
                        --query 'tasks[0].stoppedReason' --output text)
          echo "exitCode=$exit_code stoppedReason=$reason"

          # The task's stdout is the record of which migrations ran, so
          # print it whether or not the task succeeded.
          group=$(jq -r '.containerDefinitions[] | select(.name=="worker")
                         | .logConfiguration.options["awslogs-group"]' td.json)
          prefix=$(jq -r '.containerDefinitions[] | select(.name=="worker")
                          | .logConfiguration.options["awslogs-stream-prefix"]' td.json)
          echo "--- migration task output ---"
          aws logs get-log-events \
            --log-group-name "$group" \
            --log-stream-name "$prefix/worker/${task_arn##*/}" \
            --limit 250 --query 'events[].message' --output text 2>/dev/null \
            || echo "(log stream not available yet)"
          echo "--- end migration task output ---"

          if [ "$exit_code" != "0" ]; then
            echo "::error::Migrations failed (exit $exit_code) — the schema was NOT advanced."
            echo "::error::The ECS rollout is intentionally blocked, so application code"
            echo "::error::never starts against a database that lacks its tables."
            echo "::error::prisma migrate deploy is idempotent; fix the cause and re-run."
            exit 1
          fi
          echo "Migrations applied; migrate status reports the schema up to date."

  deploy:
    name: Deploy to ECS (${{ matrix.service }})
    needs: [preflight, build, migrate]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Must exceed the deploy step's wait-for-minutes (15) with room for the
    # preceding render/preflight steps and the failure diagnostics. If these
    # two numbers ever invert again, stuck rollouts go back to reporting an
    # unexplained "cancelled".
    timeout-minutes: 25
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}
    strategy:
      # Deploy services independently — a worker rollback shouldn't abort
      # an already-healthy web rollout.
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.preflight.outputs.deploy_services) }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ needs.preflight.outputs.region }}
          role-session-name: gh-actions-deploy-${{ matrix.service }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch current task definition
        env:
          FAMILY: ${{ needs.preflight.outputs.name_prefix }}-${{ matrix.service }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query 'taskDefinition' \
            --output json > task-definition.raw.json
          # Strip read-only fields that RegisterTaskDefinition rejects.
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
            task-definition.raw.json > task-definition.json

      - name: Render new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ steps.ecr.outputs.registry }}/${{ needs.preflight.outputs.name_prefix }}/${{ matrix.service }}:${{ needs.preflight.outputs.image_tag }}

      # Secret-value preflight.
      #
      # Terraform creates every Secrets Manager entry as an EMPTY container
      # — modules/secrets/main.tf deliberately leaves `initial_values` unset
      # so secret material never lands in Terraform state — and the
      # operator populates it out-of-band. That leaves a window where a
      # secret's ARN resolves but carries no AWSCURRENT version, and a task
      # referencing it dies at ResourceInitializationError BEFORE the
      # container starts. ECS surfaces that only as an ~11-minute
      # circuit-breaker rollback whose message names neither the secret nor
      # the cause (this is exactly what broke the 2026-08-01 worker rollout
      # on `database-url-system`, applied 84 minutes before it was
      # populated). DescribeSecret answers the same question in seconds and
      # names the offending secret.
      #
      # DescribeSecret returns version ids + staging labels only, never
      # `SecretString` — so this check cannot read a production credential.
      # See the SecretsPreflightDescribeOnly statement in
      # infra/terraform/modules/cicd-deploy/main.tf.
      - name: Preflight — do the referenced secrets have values?
        env:
          TASK_DEFINITION: ${{ steps.render.outputs.task-definition }}
        run: |
          set -uo pipefail

          arns=$(jq -r '[.containerDefinitions[]?.secrets[]?.valueFrom] | unique | .[]' \
                   "$TASK_DEFINITION")
          if [ -z "$arns" ]; then
            echo "Task definition references no secrets; nothing to check."
            exit 0
          fi

          err=$(mktemp)
          missing=()
          checked=0
          describe_denied=0

          while IFS= read -r raw; do
            [ -n "$raw" ] || continue
            case "$raw" in
              arn:aws:secretsmanager:*) ;;
              *) echo "Skipping (not a Secrets Manager ARN): $raw"; continue ;;
            esac

            # A bare secret ARN is exactly 7 colon-delimited fields; ECS
            # also accepts an optional :json-key:version-stage:version-id
            # suffix, which DescribeSecret would reject.
            arn=$(printf '%s' "$raw" | cut -d: -f1-7)

            if ! stages=$(aws secretsmanager describe-secret \
                            --secret-id "$arn" \
                            --query 'VersionIdsToStages' \
                            --output json 2>"$err"); then
              # Graceful no-op when the IAM change below has not been
              # applied yet, so this workflow is safe to merge first.
              # Stop probing, but still report anything already found
              # empty — a denial must never launder a known-bad secret.
              if grep -qi 'AccessDenied' "$err"; then
                describe_denied=1
                break
              fi
              echo "::error::Could not describe $arn"
              cat "$err"
              exit 1
            fi

            if printf '%s' "$stages" \
                 | jq -e '[( . // {} ) | .[]? | .[]?] | any(. == "AWSCURRENT")' >/dev/null; then
              checked=$((checked + 1))
            else
              missing+=("$arn")
            fi
          done <<< "$arns"

          if [ "${#missing[@]}" -gt 0 ]; then
            for m in "${missing[@]}"; do
              echo "::error::Secret exists but has no AWSCURRENT value: $m"
            done
            echo "::error::ECS cannot start a task whose secrets have no value — every placement"
            echo "::error::fails with ResourceInitializationError and the circuit breaker rolls back."
            echo "::error::Populate each secret, then re-run this workflow:"
            echo "::error::  aws secretsmanager put-secret-value --secret-id <name> --secret-string <value>"
            echo "::error::See docs/security/secrets-management.md."
            exit 1
          fi

          if [ "$describe_denied" -eq 1 ]; then
            echo "::warning::Deploy role lacks secretsmanager:DescribeSecret; secret-value preflight is incomplete ($checked verified before the denial)."
            echo "::warning::Apply infra/terraform/modules/cicd-deploy to turn this check on."
            exit 0
          fi

          echo "All $checked referenced secret(s) have an AWSCURRENT value."

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ needs.preflight.outputs.name_prefix }}-${{ matrix.service }}
          cluster: ${{ needs.preflight.outputs.name_prefix }}-cluster
          # Block until ECS reports the new deployment stable. The
          # service's circuit breaker (Terraform) auto-rolls-back a
          # failed rollout, which surfaces here as a job failure.
          wait-for-service-stability: true
          # MUST stay below this job's timeout-minutes. The action's own
          # default is 30 minutes — longer than the 20-minute job timeout
          # this job used to carry, which meant GitHub cancelled the job
          # before the action could ever time out. A genuinely stuck
          # rollout was therefore structurally incapable of reporting a
          # real failure: it surfaced as a bare "cancelled" with none of
          # the service events or stopped-task reasons the action prints
          # on timeout, and the diagnostics step below never ran (a
          # cancelled job skips `if: failure()`). print-agent hit exactly
          # this on 2026-08-02. Keeping this margin means the step fails
          # first, inside the job, where its output survives.
          wait-for-minutes: 15

      # Turns a stuck rollout into a self-explaining one. Without this the
      # only artifact of a failed deploy is "service did not stabilize",
      # which does not distinguish a slow-but-healthy start from a
      # crash-looping task, a failed container health check, or a circuit
      # breaker rollback — each of which needs a different response.
      - name: Explain the failed rollout
        if: failure()
        env:
          CLUSTER: ${{ needs.preflight.outputs.name_prefix }}-cluster
          SERVICE: ${{ needs.preflight.outputs.name_prefix }}-${{ matrix.service }}
        run: |
          set -uo pipefail

          echo "--- deployments (rolloutState explains WHY it never stabilized) ---"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].deployments[].{status:status,rollout:rolloutState,reason:rolloutStateReason,desired:desiredCount,running:runningCount,pending:pendingCount,td:taskDefinition}' \
            --output table || echo "(describe-services unavailable)"

          echo "--- recent service events ---"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].events[:15].[createdAt,message]' \
            --output text || echo "(events unavailable)"

          # A task that stops on its own is the signature of a boot crash:
          # stoppedReason plus the container exit code usually names the
          # cause outright (missing env var, failed health check, OOM).
          echo "--- most recent stopped tasks (boot crashes land here) ---"
          stopped=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" \
                      --desired-status STOPPED --max-items 5 \
                      --query 'taskArns' --output text 2>/dev/null || echo "")
          if [ -n "$stopped" ] && [ "$stopped" != "None" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks $stopped \
              --query 'tasks[].{stopped:stoppedReason,code:containers[0].exitCode,health:healthStatus,container:containers[0].reason}' \
              --output table || true
          else
            echo "(no stopped tasks — the rollout is slow or unhealthy rather than crashing)"
          fi

          echo "::error::${{ matrix.service }} did not reach a stable state. The rollout"
          echo "::error::detail above says which failure mode this is. ECS keeps"
          echo "::error::converging after this job ends — the circuit breaker will roll"
          echo "::error::back on its own if the new tasks cannot start."

      # Post-rollout SSR smoke check (web only).
      #
      # The ECS container health check hits `/health`, a cheap liveness
      # route that does NOT exercise the Next.js instrumentation hook or
      # SSR render path. Twice in 2026-07 a boot-time instrumentation
      # failure (missing RDS CA bundle; missing @node-rs/argon2) let every
      # SSR request 500 while `/health` stayed green — so ECS reported the
      # rollout stable and the outage was invisible to the pipeline. This
      # step curls a REAL server-rendered route and fails the deploy on any
      # 5xx, so a page-level boot failure can never again pass silently.
      #
      # Opt-in: only runs when APP_SMOKE_URL is set (graceful no-op on
      # forks / unbootstrapped accounts, matching the preflight philosophy).
      - name: Post-rollout SSR smoke check
        if: ${{ matrix.service == 'web' && vars.APP_SMOKE_URL != '' }}
        env:
          SMOKE_URL: ${{ vars.APP_SMOKE_URL }}
        run: |
          echo "Smoke-checking SSR route: $SMOKE_URL"
          code=000
          for attempt in $(seq 1 6); do
            code=$(curl -sS -o /tmp/smoke.html -w '%{http_code}' --max-time 15 "$SMOKE_URL" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "SSR route healthy (HTTP $code)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::SSR smoke check failed: $SMOKE_URL returned $code after retries."
          echo "::error::A green /health can mask an instrumentation-hook / SSR boot failure"
          echo "::error::(this masked two prod outages in 2026-07). Failing the deploy loudly."
          exit 1
