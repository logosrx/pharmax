packages:
  - "apps/*"
  - "packages/*"

# Runtime settings, migrated out of .npmrc. pnpm 11 reads ONLY auth and
# registry settings from .npmrc — every other key there is silently
# ignored, with no warning. All four settings below lived in .npmrc and
# were therefore inert.
#
# Two of them were load-bearing, and their silence broke the commit
# path: with verify-deps-before-run ignored, `pnpm run <script>` ran a
# dependency-state check and tried to reinstall; with
# confirm-modules-purge ignored, that reinstall stopped to ask before
# removing node_modules. husky gives a hook no TTY, so the prompt could
# never be answered and the pre-commit hook died on
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY.
#
# Installing is an explicit step. A script run — especially one inside a
# git hook or a CI job — must not mutate node_modules as a side effect,
# and must never block on a prompt nobody can see.
verifyDepsBeforeRun: false
confirmModulesPurge: false

# The other two match pnpm 11's own defaults (verified: pre/post scripts
# fire and peers auto-install with no config present), so these are
# declarations of intent rather than behaviour changes. Stated here so a
# future default flip is a visible diff instead of a silent one.
autoInstallPeers: true
enablePrePostScripts: true

# Dependency version overrides. pnpm 10+/11 reads these from the workspace
# file (not package.json `pnpm.overrides`).
overrides:
  # GHSA-mw96-cpmx-2vgc: force the build-time rollup 3.x pulled transitively
  # by @sentry/nextjs to the patched >=3.30.0. Selected by resolved version so
  # the unrelated rollup 4.x (vite/vitest) is left untouched.
  "rollup@<3.30.0": "^3.30.0"
  # Collapse @types/node onto exactly one resolution. Two satisfying versions
  # in the lockfile make pnpm build two `stripe` peer instances, and TypeScript
  # then treats their `Stripe.Event` as two distinct nominal types under
  # `exactOptionalPropertyTypes`, breaking `apps/worker` typecheck. Any partial
  # re-resolve (i.e. every Dependabot bump) could trigger that, so the root
  # spec is pinned exactly and referenced here as the single source of truth.
  "@types/node": "$@types/node"
  # GHSA-v2hh-gcrm-f6hx + GHSA-4c8g-83qw-93j6: fast-uri parses a literal
  # backslash, and a failed IDN canonicalization, as an authority
  # delimiter — so a crafted URI can be read as pointing at one host by
  # the validator and another by the fetcher. Reached only through
  # ajv/schema-utils inside the @sentry/nextjs build plugin and the
  # Prisma CLI, neither of which validates attacker-supplied URIs, so
  # this is hygiene rather than an exploitable path here. Patch-level
  # bump inside 3.x.
  "fast-uri@<3.1.4": "^3.1.4"
  # GHSA-6g55-p6wh-862q + the sourceMappingURL path-traversal advisory:
  # postcss auto-loads a previous source map from a `sourceMappingURL`
  # comment, so CSS from an untrusted source can read an arbitrary .map
  # file off disk. next pins postcss to an exact 8.4.31, which is what
  # drags the vulnerable copy in; the fix is a minor bump inside the
  # same major. next's own CSS pipeline uses its vendored copy under
  # next/dist/compiled, so this override only affects the postcss that
  # loads OUR postcss.config — see the build verification in the PR.
  # Range-scoped to 8.x so a hypothetical postcss 7 is left alone.
  "postcss@>=8.0.0 <8.5.18": "^8.5.18"
  # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 ships a libvips with four CVEs
  # (CVE-2026-33327/33328/35590/35591) reachable by decoding a malicious
  # image. next declares sharp as an OPTIONAL dependency at ^0.34.5 and
  # uses it for on-demand image optimization, so the decode path is
  # reachable from any remote image the app is configured to optimize.
  # Deliberately crossing next's declared range: 0.34 -> 0.35 is a minor
  # bump with no API change we use, and leaving it pinned means shipping
  # the vulnerable libvips.
  "sharp@<0.35.0": "^0.35.0"
  # GHSA for `server.fs.deny` bypass on Windows alternate paths, the
  # optimized-deps `.map` path traversal, and the dev-server request
  # reflection. All three are patched at 6.4.3. vitest 3.x still accepts
  # vite 5, so bumping the runner alone left the vulnerable 5.4.21 in the
  # tree — this is what actually moves it. Held at 6.x rather than 7.x:
  # the original reason was vite 7's Node 22.12 floor, which `engines.node`
  # now clears, so the only remaining reason is that 6.4.3 already
  # satisfies every alert and a major bump is its own change.
  # Dev-only: vite is reached exclusively through vitest, never shipped.
  "vite@<6.4.3": "^6.4.3"
  # GHSA-67mh-4wv8-2f99: esbuild's dev server sends permissive CORS, so
  # any website can make the developer's browser fetch its bundles.
  # Reached only as vite's transform dependency. vite 6.4.3 already pulls
  # a patched 0.25.x, so this is a floor that keeps a future partial
  # re-resolve from reintroducing 0.21.5.
  "esbuild@<0.25.0": "^0.25.0"
  # GHSA for @babel/core's `sourceMappingURL` arbitrary file read. Comes
  # in transitively via next; patched inside the same major, so this is a
  # patch-level bump with no API surface change.
  "@babel/core@<7.29.6": "^7.29.6"

allowBuilds:
  esbuild: true
  "@prisma/engines": true
  "@prisma/client": true
  prisma: true
  sharp: true
  # @sentry/cli's postinstall downloads the Sentry CLI binary used at
  # build time (apps/web only) to upload source maps. The binary is
  # not used at runtime. Approving it here so the install completes
  # without manual intervention on every clone.
  "@sentry/cli": true
  # protobufjs is a transitive dep of @sentry/cli's source-map
  # upload pipeline and needs build approval.
  protobufjs: true
  "@clerk/shared": set this to true or false
